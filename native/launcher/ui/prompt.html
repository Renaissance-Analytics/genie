<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genie</title>
<!-- THE LAUNCHER'S QUESTION (Tynn #1058 L5): the tray always asks before it stops anything (the owner, 2026-11-02: "Always
     ask"), in the owner's direction C, "Wish Orb". base.css and theme-c.css are put in place of the CSS marker, and the
     question (title, what stops, the confirm button's words) in place of the JSON marker, by src/ui.rs. Cancel is the
     default: Enter and Esc both cancel unless the confirm button has the focus. The page answers through
     window.ipc.postMessage (wry). Nothing here is fetched. -->
<style>/*GENIE_CSS*/
html,body{height:100%;overflow:hidden;user-select:none}
[hidden]{display:none!important}
.win{width:100%;height:100%}
.tb{-webkit-app-region:drag}
.tb-ctl i{cursor:pointer;-webkit-app-region:no-drag}
.ask{padding:20px 26px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.ask-head{display:flex;align-items:center;gap:14px}
.ask-head .lamp{width:64px;height:40px}
.ask h1{margin:0;font-size:22px}
.stops{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto}
.stops li{padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line-soft);font-size:13.5px}
.note{font-size:13px;color:var(--muted);margin:2px 0 0}
.actions{display:flex;gap:10px;margin-top:auto}
.actions .btn{flex:1;padding:12px}
.btn.danger{background:rgba(255,107,138,.14);border-color:rgba(255,107,138,.55);color:#ffd5de;font-weight:800}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body class="only">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lampfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--lamp-a)"/><stop offset="1" stop-color="var(--lamp-b)"/></linearGradient>
    <symbol id="lamp" viewBox="0 0 72 44">
      <path fill="url(#lampfill)" d="M12 27c0-5.5 7.6-8.6 19.5-8.6S51 21.5 51 27c0 0 5.8-.6 10.2-6 2.1-2.5 4.6-3.6 7.3-2.6-3.5 1.3-5.6 5.4-8.7 9.6-3.3 4.4-8 6.8-13.4 7.4H24.5C17 35.4 12 32 12 27z"/>
      <path fill="none" stroke="url(#lampfill)" stroke-width="2.6" stroke-linecap="round" d="M12.4 25.5c-6.4.4-9.2-5.8-5.2-8.4 2.3-1.5 4.9-.4 6 1.8"/>
      <path fill="url(#lampfill)" d="M21.5 19c2.2-4.4 6.2-5.8 10-5.8s7.8 1.4 10 5.8z"/>
      <circle fill="url(#lampfill)" cx="31.5" cy="10.6" r="2.4"/>
      <path fill="url(#lampfill)" d="M24 35.6h15l3.6 5H20.4z"/>
    </symbol>
  </defs>
</svg>
<main class="board">
  <div class="win">
    <div class="tb"><svg class="tb-lamp"><use href="#lamp"/></svg><span>Genie</span><div class="tb-ctl"><i data-act="cancel">×</i></div></div>
    <div class="ask">
      <div class="ask-head"><svg class="lamp"><use href="#lamp"/></svg><h1 id="title"></h1></div>
      <p class="muted" id="lead"></p>
      <ul class="stops" id="stops"></ul>
      <p class="note" id="note"></p>
      <div class="actions">
        <button class="btn primary" id="cancel" autofocus>Cancel</button>
        <button class="btn danger" id="confirm"></button>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
  var q = /*GENIE_PROMPT*/null;
  var say = function (kind) { window.ipc.postMessage(JSON.stringify({ kind: kind })); };
  document.getElementById('title').textContent = q.title;
  document.getElementById('lead').textContent = q.lead;
  document.getElementById('note').textContent = q.note || '';
  document.getElementById('confirm').textContent = q.confirm;
  var list = document.getElementById('stops');
  (q.stops || []).forEach(function (s) { var li = document.createElement('li'); li.textContent = s; list.appendChild(li); });
  if (!q.stops || q.stops.length === 0) list.hidden = true;
  document.getElementById('cancel').onclick = function () { say('cancel'); };
  document.getElementById('confirm').onclick = function () { say('confirm'); };
  document.querySelector('[data-act="cancel"]').onclick = function () { say('cancel'); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') say('cancel'); });
  document.getElementById('cancel').focus();
  say('shown');
})();
</script>
</body>
</html>
