appId: ai.aionima.genie2
productName: Genie
copyright: Genie

directories:
  output: release
  buildResources: build

# Only the built output and the manifest. The sources, the tests, the smoke scripts and the
# design tokens are not shipped — they are how the app is made, not part of it.
files:
  - dist/**
  - package.json

asar: true

# ─────────────────────────────────────────────────────────────────────────────────────────
# PUBLISH — and the pair this half belongs to.
#
# §0.8: the previous build's updater **could never see a release.** Every release published as
# a prerelease, `allowPrerelease` defaults to false in electron-updater, and it was never set.
# "Check for updates" had never worked, for the entire life of the product.
#
# `releaseType: prerelease` HERE and `allowPrerelease: true` in `src/main/upgrade.ts` are a
# pair. `test/upgrade.test.ts` asserts BOTH, so that:
#
#   - changing this to `release` and leaving the flag fails the test rather than leaving a flag
#     that is true, inert and reassuring;
#   - dropping the flag and leaving this fails the test rather than leaving an updater that
#     cannot see what it publishes.
#
# If you change one, change the other, and the test will tell you if you did not.
# ─────────────────────────────────────────────────────────────────────────────────────────
publish:
  provider: github
  owner: Renaissance-Analytics
  repo: genie2
  releaseType: prerelease

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # §7.1 is enforced in `src/main/paths.ts`: the runtime directory lives under `userData` and
  # never under the install directory, so an upgrade cannot be blocked by a file a running
  # helper holds open. That is the structural half of the fix for the 31-orphan jam; the
  # teardown in `src/main/upgrade.ts` is the other half.
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
    - deb
  category: Development

mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  # Signing secrets are not configured. A macOS build produced without them is UNSIGNED and
  # Gatekeeper will refuse it on another machine — a known, stated limitation rather than a
  # surprise at install time.
