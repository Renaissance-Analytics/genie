# `ai.tynn.genie` is the appId every installed Genie carries (0.7.0-beta.342, 2.0.0-beta.4). Windows
# identifies the application by it: keep it and the installer UPGRADES in place; change it and the
# installer puts a second Genie beside the old one. test/upgrade.test.ts holds it.
appId: ai.tynn.genie
# And package.json is named `genie`, not genie2: a one-click per-user installer puts the app in
# %LOCALAPPDATA%\Programs\<package name> (app-builder-lib targetUtil.getWindowsInstallationDirName —
# only an assisted or per-machine install uses the product name). Every installed Genie is in
# Programs\Genie because v1's package name is genie; measured 2026-10-10 when the first one-click
# build landed in Programs\genie2 beside it. test/upgrade.test.ts holds both.
productName: Genie
copyright: Genie

directories:
  output: release
  buildResources: build

# Only the built output and the manifest. The sources, the tests, the smoke scripts and the
# design tokens are not shipped — they are how the app is made, not part of it.
files:
  - dist/**
  - package.json
  # node-pty is NOT listed here on purpose. electron-builder packs node_modules from its own
  # dependency walk (`dependencies` + `optionalDependencies`, never peers, never `files`
  # globs — app-builder-lib's nodeModulesCollector), so when node-pty was fancy-term-host's
  # PEER every installer shipped without it, and the afterPack hook said so on both platforms:
  # "node-pty not found under appOutDir". fancy-term-host 0.9.0 declares it as an
  # optionalDependency, which the collector follows. The hook below is what proves that.

asar: true

# No native rebuild. The only native module is node-pty, and node-pty 1.x is Node-API
# (`node-addon-api`): it ships `prebuilds/<platform>-<arch>/pty.node` and loads THAT at runtime —
# ABI-independent, so the same binary serves Node 22 and Electron 44. electron-builder's default
# `@electron/rebuild` pass does not know this and runs node-gyp from source anyway, which needs
# Python + MSVC: present on GitHub's runners (so CI never noticed), absent on a clean machine
# (the Windows test VM failed with "Could not find any Python installation to use"). The
# prebuilt binary is what the dev tree's terminal smoke already runs on; packaging it unchanged
# is the honest build. The afterPack hook and the installed-app terminal smoke measure it.
npmRebuild: false

# ─────────────────────────────────────────────────────────────────────────────────────────
# TERMINALS IN THE INSTALLED APP — node-pty is native, and the asar cannot hold it.
#
# `fancy-term-host/docs/packaging.md`: a standard packaged Electron build spawns NO terminal at
# all until three per-OS breakages are patched. node-pty's `.node` binaries and its helpers
# (`conpty.dll` + `OpenConsole.exe` on Windows, `spawn-helper` on macOS/Linux) must live outside
# the archive, and each OS needs a fix the package ships as an `afterPack` hook. Both halves
# are required: the unpack alone leaves Windows without the `conpty/` subdir node-pty loads.
#
# `scripts/after-pack.cjs` turns the hook's `skipped`/`failed` result into a build failure,
# because an installer that silently cannot open a terminal is the exact green build this
# project exists to stop. The CI `it packages` jobs run it on both platforms.
# ─────────────────────────────────────────────────────────────────────────────────────────
# Genie's own Caddy (§6.6): fetched at build time by scripts/fetch-caddy.ts, pinned by version + sha512.
extraResources:
  - from: build/runtime
    to: runtime
    filter: ['caddy', 'caddy.exe']
  # Genie's own tray mark, read at runtime from resources/ (an asar-packed PNG cannot be handed to the tray).
  - from: build/tray-icon.png
    to: tray-icon.png

asarUnpack:
  - "**/node_modules/node-pty/**"
  # fancy-pty (fancy-term-host >= 0.10): one helper EXECUTABLE per pty, resolved in place under the
  # package — it must live on disk, outside the asar, under the install dir (§7.2 scans there).
  # Fancy: this one line is the whole packaging requirement for the fancy-pty engine.
  - "**/node_modules/@particle-academy/fancy-pty/bin/**"
afterPack: ./scripts/after-pack.cjs

# ─────────────────────────────────────────────────────────────────────────────────────────
# PUBLISH — and the pairs this half belongs to.
#
# §0.8: the previous build's updater **could never see a release.** Every release published as
# a prerelease, `allowPrerelease` defaults to false in electron-updater, and it was never set.
# "Check for updates" had never worked, for the entire life of the product.
#
# Two update channels now (the owner, 2026-10-12: "stable and dev update channels";
# src/core/update-channel.ts), each a pair of a publish type and an updater flag:
#
#   - DEV channel    ↔ prereleases:   `allowPrerelease: true`  sees a tag like v2.0.0-beta.20,
#                                     published with `releaseType: prerelease` — the default HERE.
#   - STABLE channel ↔ full releases: `allowPrerelease: false` sees a plain tag like v2.0.0,
#                                     which .github/workflows/release.yml publishes by overriding
#                                     this default with `--config.publish.releaseType=release`.
#
# test/update-channels.test.ts asserts every link (and test/upgrade.test.ts the default pair), so:
#
#   - changing this default to `release` fails the test rather than publishing every beta to
#     the stable channel;
#   - dropping the workflow's override fails the test rather than leaving a stable channel
#     (`allowPrerelease` false) that is never offered anything;
#   - dropping the flag fails the test rather than leaving a dev updater that cannot see what
#     it publishes.
#
# If you change one, change the other, and the test will tell you if you did not.
# ─────────────────────────────────────────────────────────────────────────────────────────
publish:
  provider: github
  owner: Renaissance-Analytics
  # The OLD repo, on purpose: every installed Genie (0.7.0-beta.342, 2.0.0-beta.4) carries this
  # owner/repo in its app-update.yml, and that is where it looks. Publishing anywhere else means
  # no installed copy ever sees Genie 2 (owner decision 2026-10-10). The code stays in genie2.
  repo: genie
  releaseType: prerelease

win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  # One-click and per-user, exactly as every installed Genie was built, so the upgrade is the
  # same installer shape the in-app updater has always run (owner decision 2026-10-10).
  oneClick: true
  perMachine: false
  # §7.1 is enforced in `src/main/paths.ts`: the runtime directory lives under `userData` and
  # never under the install directory, so an upgrade cannot be blocked by a file a running
  # helper holds open. That is the structural half of the fix for the 31-orphan jam; the
  # teardown in `src/main/upgrade.ts` is the other half.
  deleteAppDataOnUninstall: false
  # Two Start-menu shortcuts: Genie, and Genie in doctor mode (owner, 2026-10-13). build/installer.nsh adds the doctor
  # one beside electron-builder's own and removes it on uninstall.
  include: build/installer.nsh

linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
  # `deb` is deliberately absent. It requires a maintainer EMAIL in `package.json`, and the
  # choices were to invent an address or to publish the owner's personal one inside every
  # package — neither of which is mine to decide. AppImage needs no install and no address,
  # which makes it the more useful artifact here anyway.
  #
  # Add `deb` back with a real maintainer address if somebody wants one.

mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  # Signing secrets are not configured. A macOS build produced without them is UNSIGNED and
  # Gatekeeper will refuse it on another machine — a known, stated limitation rather than a
  # surprise at install time.
