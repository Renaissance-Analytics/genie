name: E2E (per-OS, isolated)

# FULL end-to-end gate, run in a CLEAN VM per OS. Unlike a developer's machine,
# these runners have NO live Genie, so the suite boots the REAL compiled app
# (app/background.js) via Playwright's Electron support without colliding with
# anything — which is exactly what catches BOOT-time regressions (e.g. a CJS
# `module.exports` core bundled into the ESM main output throwing at launch)
# that a webpack-compile-only check (`build:e2e`) sails straight past.
#
# This is a TEST gate only. It builds the app with `nextron build --no-pack`
# (webpack compile, no installer) and never packages, publishes, tags, or
# touches the auto-update feed. The RELEASE build stays SEPARATE — see
# release.yml (publishing) and test-build.yml (non-publishing installer smoke).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege: this workflow only reads the repo — checkout, install, build,
# and run the Electron E2E suite. No PR writes, releases, or SARIF uploads.
permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      # Every OS runs on its OWN isolated runner; one OS failing must not cancel
      # the others — we want to see the boot result on all three.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        env:
          CI: true
        run: npm ci

      # Playwright ships NO browser binaries with the npm package — a clean runner
      # must download them. The suite drives Electron, but a spec also opens a
      # Chromium context (the mobile web UI), so the chromium build is required;
      # without this the run fails with "Executable doesn't exist … chromium…".
      # (A developer's machine already has these, which is why it only bit in CI.)
      - name: Install Playwright browser (chromium)
        run: npx playwright install chromium

      # Linux runners are headless: Electron/Chromium need a virtual display AND
      # Chromium's shared libraries. `playwright install-deps chromium` installs
      # the apt packages Electron shares with Chromium; xvfb provides the display
      # (the run step below wraps the suite in `xvfb-run`). macOS/Windows runners
      # already have a display + the needed libraries, so this is Linux-only.
      # Bounded, with its own timeout — the same failure that killed the CI
      # hosting gate. apt waits forever by default, so when
      # azure.archive.ubuntu.com stopped answering on 2026-08-19 this step hung
      # for 28 minutes and the job was CANCELLED. A cancelled job does not read as
      # a failure, which is how a dead gate stays unnoticed. Now an outage fails
      # fast and loudly instead of quietly consuming the run.
      - name: Install Linux display + Electron system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Ask before installing. The runner image usually already ships xvfb and
          # Chromium's libraries, and every apt call here depends on an Ubuntu
          # mirror that has now gone unreachable twice in two days — taking the
          # Linux leg of the suite down with it while the code was fine. Skipping
          # the install when the tools are already present makes the normal case
          # instant AND independent of that mirror.
          if command -v xvfb-run >/dev/null 2>&1; then
            echo "xvfb already present: $(command -v xvfb-run)"
          else
            sudo apt-get update               -o DPkg::Lock::Timeout=180               -o Acquire::Retries=2               -o Acquire::http::Timeout=15               -o Acquire::https::Timeout=15
            sudo apt-get install -y -o DPkg::Lock::Timeout=180 xvfb
          fi
          # Playwright's own dependency check also goes through apt. It is a no-op
          # on a runner that already has the libraries, so let a mirror outage warn
          # rather than fail the leg — the browser launch below is the real test of
          # whether anything is missing, and it fails loudly on its own.
          npx playwright install-deps chromium ||             echo "::warning::playwright install-deps failed (likely an apt mirror outage) — continuing, the browser launch will catch a genuinely missing library"

      # Refresh better-sqlite3's ELECTRON prebuild before the suite (Electron's
      # Node ABI differs from the host Node). This is `pretest:e2e`, run
      # explicitly so its output is visible even if `test:e2e`'s pre-hook is
      # skipped; it uses prebuild-install (no node-gyp / VS Build Tools), so it
      # works on a clean runner across all three OSes.
      - name: Prepare native modules for Electron (better-sqlite3 prebuild)
        run: npm run pretest:e2e

      - name: Run E2E (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:e2e

      - name: Run E2E (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e
