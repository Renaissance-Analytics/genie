name: Test Windows signing

# A branch push queues the exact head for the protected environment's owner approval.
on:
  push:
    branches: [next/release-signing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign:
    if: github.ref == 'refs/heads/next/release-signing'
    runs-on: windows-latest
    environment: sign-test
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Normal CI gates the unit suite. Follow its packaging build, including build:main's Windows launcher.
      - run: npm run build
      - name: fetch the pinned Caddy runtime
        run: npx tsx scripts/fetch-caddy.ts
      - uses: azure/login@v2
        env:
          AZURE_CORE_OUTPUT: none
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: build and sign without publishing
        run: npx electron-builder --publish never
      # Which files the build signed (the rest keep their own publisher's signature), as in release.yml.
      - name: the sign plan, for the verifier
        shell: pwsh
        run: node scripts/win-sign-plan.mjs release/win-unpacked electron-builder.yml --json release/signature-evidence/win-sign-plan.json
      - name: verify every Windows signature before upload
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1
      - name: read the beta.59 reference release asset names
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v2.0.0-beta.59 --repo "$GITHUB_REPOSITORY" --json tagName,assets --jq '{tagName,assets:[.assets[]|{name,size}]}' > release/signature-evidence/beta59-release-assets.json
      - name: prove the signed installer's updater metadata and asset names
        run: node scripts/verify-windows-update.cjs release release/signature-evidence/beta59-release-assets.json
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-installer
          path: |
            release/*-setup.exe
            release/*-setup.exe.blockmap
            release/latest.yml
            release/signature-evidence/
          if-no-files-found: error
          retention-days: 7
