name: release

# THE ONE DOOR OUT OF THIS REPOSITORY — and it only ever opens onto a DRAFT.
#
# Runs for a `v*` tag and nothing else. A push to `main` builds in ci.yml and publishes
# nothing; a tag is the owner's deliberate, approved act, and this workflow is what that act
# triggers. `test/release-workflow.test.ts` and `test/release-draft.test.ts` hold every rule below.
#
# DRAFT FIRST (the owner, 2026-10-22: "why the fuck was beta 38 published with no release notes and how was this able
# to get past our CI?"). Until then each platform job published straight into a PUBLIC prerelease and the notes came
# after: beta.38 was public with an empty body for ~7 minutes, and beta.35 and beta.37 — whose Windows job failed, so
# the notes job never ran — are public with empty bodies and Linux-only assets. Now:
#
#   1. guard    the tag names package.json's version and docs/releases/<tag>.md exists; then it creates the ONE draft
#               for the tag (prerelease flag by the tag, body = that file), or reuses a draft a previous run made, and
#               REFUSES if the tag's release is already public.
#   2. publish  each platform (matrix) builds and uploads into that draft. electron-publish's GitHubPublisher
#               (getOrCreateRelease) returns an existing DRAFT for the tag whatever the publish type, and EP_DRAFT —
#               read first, before EP_PRE_RELEASE and the config's releaseType — makes any release it would CREATE a
#               draft too. electron-builder.yml says `releaseType: draft` as well.
#   3. verify   runs only when EVERY platform job succeeded (`needs: publish` covers every matrix leg). It writes the
#               notes from docs/releases/<tag>.md again and reads the draft back: still a draft, notes non-empty with
#               "## What's new", every updater file present (Windows setup.exe + .blockmap + latest.yml; Linux
#               AppImage + latest-linux.yml), prerelease flag as the tag says (src/core/release-check.ts).
#
# If any platform fails, nothing is public: the draft is invisible to every installed Genie (electron-updater reads the
# public releases.atom feed and /releases/latest, and a draft's assets are not downloadable without a token).
#
# PUBLISHING IS THE OWNER'S STEP, NEVER THIS WORKFLOW'S. After `verify` is green and the owner has approved this exact
# version, he publishes it with his own gh:
#
#     gh release edit <tag> -R Renaissance-Analytics/genie --draft=false
#
# That `release: published` event runs release-published.yml, which closes the issues the release ships.
#
# WHERE IT PUBLISHES: THIS repository, `Renaissance-Analytics/genie` — the owner/repo inside every
# installed Genie's `app-update.yml` (0.7.0-beta.342 and 2.0.0-beta.4 alike), where an installed
# copy looks and nowhere else. Genie 2's code moved here from genie2 (the owner, 2026-10-16), so
# the publish uses this repository's own `GITHUB_TOKEN`, with `contents: write` on the jobs that
# write the release. There is no cross-repo token.
#
# The publish target itself (owner, repo) is electron-builder.yml's `publish` block — one place,
# held by test/upgrade.test.ts. The PRERELEASE FLAG follows the tag (the owner, 2026-10-12: "stable
# and dev update channels"): `v2.0.0-beta.20` is a prerelease, which only the dev channel sees; a
# plain `v2.0.0` is a full release, which stable (and dev) see. test/update-channels.test.ts holds
# the `case` in guard to `releaseTypeForTag`.
#
# EACH TRACK ITS OWN DRAFT (Tynn #1058 L8; the envelope's .ai/plans/genie-2-host-split-2026-10-31.md, slice 8; docs/track-releases.md).
# The launcher reads the client, browser, host and launcher each from its own release, `<track>-v<build>`. One approved
# ROUND tag builds them all: `tracks-v<build>` for the stable channel, `tracks-dev-v<build>` for dev (prereleases). The
# app jobs above run for `v*` only (their guard's `if`), the track jobs below for a round only (theirs), and every other
# job hangs off one of the two guards.
#
#   1. tracks-guard    builds dist/ and fingerprints each track (scripts/track-release-plan.ts, src/core/track-release-plan.ts);
#                      a track is drafted only when its fingerprint differs from its last PUBLISHED release's (a host brings
#                      its client, a client its browser). Each such track needs docs/releases/<track>-v<build>.md with
#                      "## What's new"; then its draft is made at this commit (the track's tag is made when the owner publishes).
#   2. tracks-linux    the Linux packages (scripts/build-track-packages.mjs) and launcher, no secret; artifacts only.
#      tracks-windows  Authenticode FIRST: the launcher signed (scripts/sign-windows-files.mjs), the client built --signed, the
#                      trees verified (scripts/verify-track-signatures.ps1), and only then are those bytes in the packages.
#                      Both build the launcher trusting the release environment's GENIE_MANIFEST_PUBLIC_KEY (beside the
#                      release key native/launcher/src/keys.rs builds in), and refuse to build with none.
#   3. tracks-sign     THE ONLY JOB THAT SEES GENIE_MANIFEST_SIGNING_KEY (environment `release`): it refuses, before it signs
#                      or uploads anything, when the key or the public key is missing or the public key is not the one
#                      built into the launcher; then signs each planned track's manifests (scripts/sign-manifest.mjs) and
#                      uploads that track's own files into that track's draft, after checking it is still a draft.
#   4. tracks-verify   each draft's notes written again and the draft read back (release-check: still a draft, notes, every
#                      package with its manifest and signature, nothing else, prerelease as the channel says).
#
# Nothing here un-drafts a track's release either: each is published by the owner, after his approval of that round, with
#     gh release edit <track>-v<build> -R Renaissance-Analytics/genie --draft=false
# (the host's after its client's: the launcher refuses a host whose client is not in the feed).

on:
  push:
    tags:
      - 'v*'
      - 'tracks-v*'
      - 'tracks-dev-v*'

permissions:
  contents: read

jobs:
  guard:
    name: the tag names the version in package.json, and its draft exists
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: compare
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json: $pkg  tag: $tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v$tag does not match package.json $pkg — bump the version in a commit first; a tag is a claim about a version"
            exit 1
          fi
          # No notes, no release: the owner attached the known limitations to the go, and a
          # release body that says nothing is a version number. docs/releases/v<version>.md.
          if [ ! -s "docs/releases/v$tag.md" ]; then
            echo "::error::docs/releases/v$tag.md is missing or empty — write the release notes (what is in, known limitations, how it was verified) before tagging"
            exit 1
          fi
      # The ONE draft every platform uploads into. Created here, once, before any build: two platform jobs that each
      # created their own would make two drafts for the same tag (drafts do not collide on a tag name).
      - name: create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          # gh finds a draft by its pending tag name too (cli/cli pkg/cmd/release/shared/fetch.go, fetchDraftRelease).
          existing="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$existing" = "false" ]; then
            echo "::error::$GITHUB_REF_NAME already has a release and it is already public — this workflow only builds drafts; nothing was changed"
            exit 1
          elif [ "$existing" = "true" ]; then
            echo "reusing the draft for $GITHUB_REF_NAME (a previous run made it)"
            gh release edit "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag $prerelease --title "$tag" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi

  publish:
    name: build and upload into the draft (${{ matrix.os }})
    needs: guard
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # Windows has its own protected signing job below; no macOS.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # NO TESTS HERE (the owner, 2026-11-11: GitHub builds, signs and publishes, and tests nothing). The gate before a tag
      # is scripts/ci/linux.sh on omarchy-test and scripts/ci/windows.ps1 on an Azure Windows VM (docs/ci.md).
      - run: npm run build
      # electron-builder finds the draft guard made for this tag on the repository named in
      # electron-builder.yml and uploads the installer, its blockmap and latest*.yml into it. There is no macOS job:
      # macOS support is dropped for now (owner, 2026-10-11); the `mac` block in electron-builder.yml stays for when it returns.
      - name: fetch the pinned Caddy runtime
        run: npx tsx scripts/fetch-caddy.ts

      - name: publish
        # bash on EVERY runner: the script below is bash, and Windows' default run shell is PowerShell (the 2.0.0-beta.20
        # release run died there with a ParserError and built no installer). test/release-step-shells.test.ts holds it.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-publish reads EP_DRAFT before anything else: whatever it creates is a draft. It never un-drafts
          # the draft it finds. test/release-draft.test.ts refuses EP_PRE_RELEASE and any public releaseType here.
          EP_DRAFT: 'true'
        # Built without publishing, its feed told which host it carries (Tynn #413), then uploaded into the guard's draft
        # with gh, exactly as Windows is: electron-builder writes latest-linux.yml only as it builds.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npx electron-builder --publish never
          node scripts/feed-host-identity.mjs release/latest-linux.yml
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::Linux upload requires an existing draft release"
            exit 1
          fi
          echo "uploading v$tag into its draft"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release/*.AppImage release/latest-linux.yml --clobber

  # Separate job: environment and id-token permission are job-scoped, so putting them on
  # the old matrix would grant Linux the Windows signing identity as well.
  publish-windows:
    name: sign, verify and upload Windows into the draft
    needs: guard
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Normal CI gates the unit suite. Follow its packaging build, including build:main's Windows launcher.
      - run: npm run build
      - name: fetch the pinned Caddy runtime
        run: npx tsx scripts/fetch-caddy.ts
      - uses: azure/login@v2
        env:
          AZURE_CORE_OUTPUT: none
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: build and sign without uploading
        run: npx electron-builder --publish never
      # Which files the build signed, by electron-builder's own rule and electron-builder.yml's signExts (the rest keep
      # their own publisher's signature): the verifier below reads it (scripts/win-sign-plan.mjs; test/win-sign-plan.test.ts).
      - name: the sign plan, for the verifier
        shell: pwsh
        run: node scripts/win-sign-plan.mjs release/win-unpacked electron-builder.yml --json release/signature-evidence/win-sign-plan.json
      - name: verify every Windows signature before upload
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1
      - name: read the beta.59 reference release asset names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view v2.0.0-beta.59 --repo "$GITHUB_REPOSITORY" --json tagName,assets --jq '{tagName,assets:[.assets[]|{name,size}]}' > release/signature-evidence/beta59-release-assets.json
      - name: prove the signed installer's updater metadata and asset names
        run: node scripts/verify-windows-update.cjs release release/signature-evidence/beta59-release-assets.json
      # Which genie-host this release carries (Tynn #413): an update whose host is the one running is client-only.
      - name: name the host in the feed
        run: node scripts/feed-host-identity.mjs release/latest.yml
      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Upload the exact verified bytes; invoking builder again would rebuild the installer.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Recheck after the environment approval/build: do not upload if someone published
          # the draft while Windows was signing. A lookup failure also refuses the upload.
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::Windows upload requires an existing draft release"
            exit 1
          fi
          echo "uploading verified Windows v$tag into its draft"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "release/Genie-$tag-setup.exe" "release/Genie-$tag-setup.exe.blockmap" release/latest.yml --clobber

  verify:
    name: write the notes and verify the draft (it stays a draft)
    # Every platform leg of `publish` must succeed; a failed or cancelled leg skips this job, and the draft stays a draft.
    needs: [publish, publish-windows]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The body comes from docs/releases/v<version>.md (written by guard already; again here so the file at this
      # commit is what the draft says), then the draft is read back and checked (src/core/release-check.ts).
      - name: write the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file "docs/releases/${{ github.ref_name }}.md"
      - name: verify notes, assets and flags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json tagName,isDraft,isPrerelease,body,assets > release.json
          npx --yes tsx@4.23.15 scripts/verify-release-draft.ts "${{ github.ref_name }}" release.json

  # ── EACH TRACK ITS OWN DRAFT (Tynn #1058 L8): see the header. ─────────────────────────────────────────────────────
  tracks-guard:
    name: the round's tracks that changed, their notes, and their drafts
    if: startsWith(github.ref_name, 'tracks-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tracks: ${{ steps.plan.outputs.tracks }}
      build: ${{ steps.plan.outputs.build }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Which tracks changed since their last PUBLISHED release (src/core/track-release-plan.ts). The round's tag must be a
      # track build (tracks-v2026.11.28-1); the plan refuses anything else.
      - name: plan the round
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --limit 1000 > releases.json
          npx tsx scripts/track-release-plan.ts fingerprints --out fingerprints.json
          npx tsx scripts/track-release-plan.ts plan --tag "$GITHUB_REF_NAME" --fingerprints fingerprints.json --releases releases.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tracks-plan
          path: plan.json
      # No notes, no release, per track: each changed track's docs/releases/<track>-v<build>.md, with its "## What's new"
      # (the update window shows it). Every file is checked before any draft is made.
      - name: the notes of every changed track
        env:
          tracks: ${{ steps.plan.outputs.tracks }}
          build: ${{ steps.plan.outputs.build }}
        run: |
          missing=0
          for track in $tracks; do
            tag="${track}-v${build}"
            if [ ! -s "docs/releases/$tag.md" ]; then
              echo "::error::docs/releases/$tag.md is missing or empty — the $track changed, so write its release notes (what is in, known limitations, how it was verified) before tagging the round"
              missing=1
            elif ! grep -q "^## What's new" "docs/releases/$tag.md"; then
              echo "::error::docs/releases/$tag.md has no \"## What's new\" section — the update window would show nothing"
              missing=1
            fi
          done
          exit $missing
      # One draft per changed track, at this commit. Made here, once, before any build, as the app's guard does.
      - name: create the drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          tracks: ${{ steps.plan.outputs.tracks }}
          build: ${{ steps.plan.outputs.build }}
          channel: ${{ steps.plan.outputs.channel }}
        run: |
          case "$channel" in dev) prerelease=--prerelease ;; *) prerelease= ;; esac
          for track in $tracks; do
            tag="${track}-v${build}"
            existing="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
            if [ "$existing" = "false" ]; then
              echo "::error::$tag already has a release and it is already public — this workflow only builds drafts; nothing was changed"
              exit 1
            elif [ "$existing" = "true" ]; then
              echo "reusing the draft for $tag (a previous run made it)"
              gh release edit "$tag" --notes-file "docs/releases/$tag.md"
            else
              gh release create "$tag" --draft --target "$GITHUB_SHA" $prerelease --title "Genie $track $build" --notes-file "docs/releases/$tag.md"
            fi
          done

  tracks-linux:
    name: the Linux packages of the round (no secret)
    needs: tracks-guard
    if: needs.tracks-guard.outputs.tracks != ''
    runs-on: ubuntu-latest
    # For the release environment's public key only (a variable, not a secret): the launcher is built trusting it.
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: fetch the pinned Caddy runtime
        run: npx tsx scripts/fetch-caddy.ts
      - name: build the launcher
        env:
          GENIE_TRACK_BUILD: ${{ needs.tracks-guard.outputs.build }}
          GENIE_MANIFEST_PUBLIC_KEYS: ${{ vars.GENIE_MANIFEST_PUBLIC_KEY }}
        run: |
          if [ -z "$GENIE_MANIFEST_PUBLIC_KEYS" ]; then
            echo "::error::the release environment has no variable GENIE_MANIFEST_PUBLIC_KEY — the launcher would be built without the round's key; nothing was built"
            exit 1
          fi
          sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev
          cd native/launcher && cargo build --locked --release --bin genie
      - name: the packages and their unsigned manifests
        run: node scripts/build-track-packages.mjs packages --build "${{ needs.tracks-guard.outputs.build }}" --channel "${{ needs.tracks-guard.outputs.channel }}" --launcher native/launcher/target/release/genie
      - uses: actions/upload-artifact@v4
        with:
          name: tracks-linux
          path: |
            release/tracks/packages/*.tar.zst
            release/tracks/packages/*.manifest.json
          if-no-files-found: error

  tracks-windows:
    name: sign, verify and pack the Windows packages of the round
    needs: tracks-guard
    if: needs.tracks-guard.outputs.tracks != ''
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: fetch the pinned Caddy runtime
        run: npx tsx scripts/fetch-caddy.ts
      - uses: azure/login@v2
        env:
          AZURE_CORE_OUTPUT: none
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: build the launcher
        shell: bash
        env:
          GENIE_TRACK_BUILD: ${{ needs.tracks-guard.outputs.build }}
          GENIE_MANIFEST_PUBLIC_KEYS: ${{ vars.GENIE_MANIFEST_PUBLIC_KEY }}
        run: |
          if [ -z "$GENIE_MANIFEST_PUBLIC_KEYS" ]; then
            echo "::error::the release environment has no variable GENIE_MANIFEST_PUBLIC_KEY — the launcher would be built without the round's key; nothing was built"
            exit 1
          fi
          cd native/launcher && cargo build --locked --release --bin genie
      # AUTHENTICODE FIRST: the launcher before it is packed; the client (and the host made from it) as electron-builder
      # builds it (--signed). The packages and their manifests are made from these signed bytes.
      - name: sign the launcher
        run: node scripts/sign-windows-files.mjs native/launcher/target/release/genie.exe
      - name: the packages, from signed programs, and their unsigned manifests
        run: node scripts/build-track-packages.mjs packages --build "${{ needs.tracks-guard.outputs.build }}" --channel "${{ needs.tracks-guard.outputs.channel }}" --launcher native/launcher/target/release/genie.exe --signed
      - name: verify every Windows signature in the packages
        shell: pwsh
        run: ./scripts/verify-track-signatures.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tracks-windows
          path: |
            release/tracks/packages/*.zip
            release/tracks/packages/*.manifest.json
            release/signature-evidence/track-signatures.json
          if-no-files-found: error

  tracks-sign:
    name: sign the manifests and upload each track into its draft (the only job with the signing key)
    needs: [tracks-guard, tracks-linux, tracks-windows]
    if: needs.tracks-guard.outputs.tracks != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: sign and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENIE_MANIFEST_SIGNING_KEY: ${{ secrets.GENIE_MANIFEST_SIGNING_KEY }}
          GENIE_MANIFEST_PUBLIC_KEY: ${{ vars.GENIE_MANIFEST_PUBLIC_KEY }}
          tracks: ${{ needs.tracks-guard.outputs.tracks }}
          build: ${{ needs.tracks-guard.outputs.build }}
        run: |
          if [ -z "$GENIE_MANIFEST_SIGNING_KEY" ]; then
            echo "::error::the release environment has no secret GENIE_MANIFEST_SIGNING_KEY — the owner adds it (docs/track-releases.md); nothing was signed or uploaded"
            exit 1
          fi
          if [ -z "$GENIE_MANIFEST_PUBLIC_KEY" ]; then
            echo "::error::the release environment has no variable GENIE_MANIFEST_PUBLIC_KEY — the owner adds it (docs/track-releases.md); nothing was signed or uploaded"
            exit 1
          fi
          # RELEASE_PUBLIC_KEY as native/launcher/src/keys.rs builds it in: the job signs only with the key every launcher trusts.
          built_in="$(sed -n 's/^pub const RELEASE_PUBLIC_KEY: &str = "\(.*\)";$/\1/p' native/launcher/src/keys.rs)"
          if [ "$GENIE_MANIFEST_PUBLIC_KEY" != "$built_in" ]; then
            echo "::error::GENIE_MANIFEST_PUBLIC_KEY is not the key built into the launcher (RELEASE_PUBLIC_KEY in native/launcher/src/keys.rs) — no launcher would trust what this job signs; nothing was signed or uploaded"
            exit 1
          fi
          files=()
          for track in $tracks; do
            for m in packages/"${track}-${build}-"*.manifest.json; do files+=("$m"); done
          done
          node scripts/sign-manifest.mjs "${files[@]}"
          for track in $tracks; do
            tag="${track}-v${build}"
            node -e 'const p=require("./packages/plan.json");const [t,b]=process.argv.slice(1);process.stdout.write(JSON.stringify({track:t,build:b,fingerprint:p.fingerprints[t],commit:process.env.GITHUB_SHA})+"\n")' "$track" "$build" > "packages/${track}-${build}.fingerprint.json"
            # Recheck before the upload: nothing goes into a release that someone published meanwhile.
            if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::$tag is not a draft any more — nothing more was uploaded into it"
              exit 1
            fi
            echo "uploading $track $build into its draft"
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "packages/${track}-${build}-"* "packages/${track}-${build}.fingerprint.json"
          done

  tracks-verify:
    name: write each track's notes and verify its draft (each stays a draft)
    needs: [tracks-guard, tracks-sign]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: notes, assets and flags, per track
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tracks: ${{ needs.tracks-guard.outputs.tracks }}
          build: ${{ needs.tracks-guard.outputs.build }}
          channel: ${{ needs.tracks-guard.outputs.channel }}
        run: |
          bad=0
          for track in $tracks; do
            tag="${track}-v${build}"
            gh release edit "$tag" --repo "${{ github.repository }}" --notes-file "docs/releases/$tag.md"
            gh release view "$tag" --repo "${{ github.repository }}" --json tagName,isDraft,isPrerelease,body,assets > release.json
            npx tsx scripts/verify-release-draft.ts "$tag" release.json --channel "$channel" || bad=1
          done
          exit $bad
