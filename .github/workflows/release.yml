name: release

# THE ONE DOOR OUT OF THIS REPOSITORY — and it only ever opens onto a DRAFT.
#
# Runs for a `v*` tag and nothing else. A push to `main` builds in ci.yml and publishes
# nothing; a tag is the owner's deliberate, approved act, and this workflow is what that act
# triggers. `test/release-workflow.test.ts` and `test/release-draft.test.ts` hold every rule below.
#
# DRAFT FIRST (the owner, 2026-10-22: "why the fuck was beta 38 published with no release notes and how was this able
# to get past our CI?"). Until then each platform job published straight into a PUBLIC prerelease and the notes came
# after: beta.38 was public with an empty body for ~7 minutes, and beta.35 and beta.37 — whose Windows job failed, so
# the notes job never ran — are public with empty bodies and Linux-only assets. Now:
#
#   1. guard    the tag names package.json's version and docs/releases/<tag>.md exists; then it creates the ONE draft
#               for the tag (prerelease flag by the tag, body = that file), or reuses a draft a previous run made, and
#               REFUSES if the tag's release is already public.
#   2. publish  each platform (matrix) builds and uploads into that draft. electron-publish's GitHubPublisher
#               (getOrCreateRelease) returns an existing DRAFT for the tag whatever the publish type, and EP_DRAFT —
#               read first, before EP_PRE_RELEASE and the config's releaseType — makes any release it would CREATE a
#               draft too. electron-builder.yml says `releaseType: draft` as well.
#   3. verify   runs only when EVERY platform job succeeded (`needs: publish` covers every matrix leg). It writes the
#               notes from docs/releases/<tag>.md again and reads the draft back: still a draft, notes non-empty with
#               "## What's new", every updater file present (Windows setup.exe + .blockmap + latest.yml; Linux
#               AppImage + latest-linux.yml), prerelease flag as the tag says (src/core/release-check.ts).
#
# If any platform fails, nothing is public: the draft is invisible to every installed Genie (electron-updater reads the
# public releases.atom feed and /releases/latest, and a draft's assets are not downloadable without a token).
#
# PUBLISHING IS THE OWNER'S STEP, NEVER THIS WORKFLOW'S. After `verify` is green and the owner has approved this exact
# version, he publishes it with his own gh:
#
#     gh release edit <tag> -R Renaissance-Analytics/genie --draft=false
#
# That `release: published` event runs release-published.yml, which closes the issues the release ships.
#
# WHERE IT PUBLISHES: THIS repository, `Renaissance-Analytics/genie` — the owner/repo inside every
# installed Genie's `app-update.yml` (0.7.0-beta.342 and 2.0.0-beta.4 alike), where an installed
# copy looks and nowhere else. Genie 2's code moved here from genie2 (the owner, 2026-10-16), so
# the publish uses this repository's own `GITHUB_TOKEN`, with `contents: write` on the jobs that
# write the release. There is no cross-repo token.
#
# The publish target itself (owner, repo) is electron-builder.yml's `publish` block — one place,
# held by test/upgrade.test.ts. The PRERELEASE FLAG follows the tag (the owner, 2026-10-12: "stable
# and dev update channels"): `v2.0.0-beta.20` is a prerelease, which only the dev channel sees; a
# plain `v2.0.0` is a full release, which stable (and dev) see. test/update-channels.test.ts holds
# the `case` in guard to `releaseTypeForTag`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  guard:
    name: the tag names the version in package.json, and its draft exists
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: compare
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json: $pkg  tag: $tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v$tag does not match package.json $pkg — bump the version in a commit first; a tag is a claim about a version"
            exit 1
          fi
          # No notes, no release: the owner attached the known limitations to the go, and a
          # release body that says nothing is a version number. docs/releases/v<version>.md.
          if [ ! -s "docs/releases/v$tag.md" ]; then
            echo "::error::docs/releases/v$tag.md is missing or empty — write the release notes (what is in, known limitations, how it was verified) before tagging"
            exit 1
          fi
      # The ONE draft every platform uploads into. Created here, once, before any build: two platform jobs that each
      # created their own would make two drafts for the same tag (drafts do not collide on a tag name).
      - name: create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          # gh finds a draft by its pending tag name too (cli/cli pkg/cmd/release/shared/fetch.go, fetchDraftRelease).
          existing="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$existing" = "false" ]; then
            echo "::error::$GITHUB_REF_NAME already has a release and it is already public — this workflow only builds drafts; nothing was changed"
            exit 1
          elif [ "$existing" = "true" ]; then
            echo "reusing the draft for $GITHUB_REF_NAME (a previous run made it)"
            gh release edit "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag $prerelease --title "$tag" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi

  publish:
    name: build and upload into the draft (${{ matrix.os }})
    needs: guard
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]   # no macOS: dropped for now (owner, 2026-10-11)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Windows gets the 30 s per-test budget CI's unit (windows) job has (test/ci-windows-test-budget.test.ts says why:
      # the beta.37 release failed here on a 5019 ms test); Linux keeps vitest's 5 s default.
      - run: npm test ${{ runner.os == 'Windows' && '-- --testTimeout=30000' || '' }}
      - run: npm run build
      # electron-builder finds the draft guard made for this tag on the repository named in
      # electron-builder.yml and uploads the installer, its blockmap and latest*.yml into it. There is no macOS job:
      # macOS support is dropped for now (owner, 2026-10-11); the `mac` block in electron-builder.yml stays for when it returns.
      - name: fetch the pinned Caddy runtime
        run: npx tsx scripts/fetch-caddy.ts

      - name: publish
        # bash on EVERY runner: the script below is bash, and Windows' default run shell is PowerShell (the 2.0.0-beta.20
        # release run died there with a ParserError and built no installer). test/release-step-shells.test.ts holds it.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-publish reads EP_DRAFT before anything else: whatever it creates is a draft. It never un-drafts
          # the draft it finds. test/release-draft.test.ts refuses EP_PRE_RELEASE and any public releaseType here.
          EP_DRAFT: 'true'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "uploading v$tag into its draft"
          npx electron-builder --publish always

  verify:
    name: write the notes and verify the draft (it stays a draft)
    # Every platform leg of `publish` must succeed; a failed or cancelled leg skips this job, and the draft stays a draft.
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The body comes from docs/releases/v<version>.md (written by guard already; again here so the file at this
      # commit is what the draft says), then the draft is read back and checked (src/core/release-check.ts).
      - name: write the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file "docs/releases/${{ github.ref_name }}.md"
      - name: verify notes, assets and flags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json tagName,isDraft,isPrerelease,body,assets > release.json
          npx --yes tsx@4.23.15 scripts/verify-release-draft.ts "${{ github.ref_name }}" release.json
