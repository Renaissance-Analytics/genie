name: release

# THE ONE DOOR OUT OF THIS REPOSITORY.
#
# Runs for a `v*` tag and nothing else. A push to `main` builds in ci.yml and publishes
# nothing; a tag is the owner's deliberate, approved act, and this workflow is what that act
# triggers. `test/release-workflow.test.ts` holds every rule below.
#
# WHERE IT PUBLISHES: `Renaissance-Analytics/genie` — the OLD repository — because that is the
# owner/repo inside every installed Genie's `app-update.yml` (0.7.0-beta.342 and 2.0.0-beta.4
# alike), and an installed copy looks nowhere else. The code lives here; the releases live
# there (owner decision, 2026-10-10). `GITHUB_TOKEN` cannot write another repository's
# releases, so the publish uses `GENIE_RELEASE_TOKEN`: a fine-grained token with Contents:
# read/write on `Renaissance-Analytics/genie`, stored as a secret of THIS repository.
#
# The publish target itself (owner, repo) is electron-builder.yml's `publish` block — one place,
# held by test/upgrade.test.ts. The RELEASE TYPE follows the tag (the owner, 2026-10-12: "stable
# and dev update channels"): `v2.0.0-beta.20` publishes as a prerelease, which only the dev
# channel sees; a plain `v2.0.0` publishes as a full release, which stable (and dev) see.
# test/update-channels.test.ts holds the `case` below to `releaseTypeForTag`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  guard:
    name: the tag names the version in package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json: $pkg  tag: $tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v$tag does not match package.json $pkg — bump the version in a commit first; a tag is a claim about a version"
            exit 1
          fi
          # No notes, no release: the owner attached the known limitations to the go, and a
          # release body that says nothing is a version number. docs/releases/v<version>.md.
          if [ ! -s "docs/releases/v$tag.md" ]; then
            echo "::error::docs/releases/v$tag.md is missing or empty — write the release notes (what is in, known limitations, how it was verified) before tagging"
            exit 1
          fi

  publish:
    name: build and publish (${{ matrix.os }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]   # no macOS: dropped for now (owner, 2026-10-11)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # electron-builder creates (or reuses) the GitHub release for this tag on the repository
      # named in electron-builder.yml, uploads the installer, its blockmap and latest*.yml, and
      # marks it a prerelease or a full release by the tag (the publish step). There is no macOS job: macOS support is
      # dropped for now (owner, 2026-10-11); the `mac` block in electron-builder.yml stays for when it returns.
      - name: fetch the pinned Caddy runtime
        run: npx tsx scripts/fetch-caddy.ts

      - name: publish
        # bash on EVERY runner: the script below is bash, and Windows' default run shell is PowerShell (the 2.0.0-beta.20
        # release run died there with a ParserError and built no installer). test/release-step-shells.test.ts holds it.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GENIE_RELEASE_TOKEN }}
        # electron-builder.yml defaults to `releaseType: prerelease`; a plain tag overrides it to
        # `release` so the stable channel (allowPrerelease false) is offered it.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in *-*) type=prerelease ;; *) type=release ;; esac
          echo "publishing v$tag as a $type"
          npx electron-builder --publish always --config.publish.releaseType=$type

  notes:
    name: write the release notes into the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # electron-builder created the release on the OLD repo (electron-builder.yml publish block);
      # the body comes from docs/releases/v<version>.md, with the same cross-repo token. The
      # release keeps the type the publish step gave it (prerelease or full release, by the tag);
      # whether it is a draft is the owner's call after this runs.
      - name: set the body
        env:
          GH_TOKEN: ${{ secrets.GENIE_RELEASE_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo Renaissance-Analytics/genie --notes-file "docs/releases/${{ github.ref_name }}.md"
