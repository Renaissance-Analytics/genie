name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# this workflow only reads the repo — checkout, install, typecheck, test, build.
# No PR writes, releases, or SARIF uploads, so read-only contents is sufficient.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (main)
        run: npx tsc --noEmit -p main/tsconfig.json
      - name: Typecheck (renderer)
        run: npx tsc --noEmit -p renderer/tsconfig.json
      # The E2E specs used to be the one tree nothing typechecked, and the cost
      # was not theoretical: a helper whose return type omitted a field made a
      # spec wait 15 seconds for something that could never arrive, and the
      # feature under test was working the whole time. Checked HERE (cheap,
      # seconds) rather than discovered in the E2E workflow (minutes, per OS).
      - name: Typecheck (e2e)
        run: npx tsc --noEmit -p e2e/tsconfig.json
      - name: Vitest
        run: npm test
      - name: Build renderer (static export)
        run: npx next build renderer

  # REAL hosting tests (`*.real.test.ts`) — launch the ACTUAL bundled Caddy /
  # php-cgi and curl them, so a broken serve mode fails CI instead of shipping
  # (the mocked hosting E2E never runs a web server; two hostServe sites colliding
  # on Caddy's :2019 admin port sailed straight through it). Linux-only: the
  # runner has Docker for future container-backed real tests, and php-cgi installs
  # cleanly. Needs `build:runtime` first for the Caddy binary.
  hosting:
    runs-on: ubuntu-latest
    # 20, not 15: apt now regularly waits on the runner's own
    # unattended-upgrades holding the dpkg lock, and the real hosting tests need
    # room after it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      # Bounded, and with its own timeout, because this step silently killed the
      # gate. apt waits on the dpkg lock FOREVER by default; on 2026-08-19 the
      # runner image began holding it long enough that apt ate 13m19s of a
      # 15-minute job budget, so the job was CANCELLED — and a cancelled job does
      # not read as a failure, so three merges went by with the real-hosting gate
      # never running at all. DPkg::Lock::Timeout makes the wait bounded, and the
      # step timeout turns any remaining hang into a visible FAILURE instead of a
      # quiet cancellation.
      # Only reach for apt when the runner does not already have php-cgi.
      #
      # This step silently killed the gate: apt waits forever by default, and on
      # 2026-08-19 azure.archive.ubuntu.com stopped answering, so every repo was
      # retried with backoff until the job hit its budget and was CANCELLED — and a
      # cancelled job does not read as a failure, so three merges went by with the
      # real-hosting gate never running.
      #
      # Asking whether the binary is there first makes the normal case instant and
      # independent of any mirror. The apt path stays as the fallback, now bounded
      # (retries + per-request timeouts + a lock timeout) and under a step timeout,
      # so a hang is a visible FAILURE instead of a quiet cancellation.
      - name: Ensure php-cgi (the FastCGI worker the php serve mode spawns)
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v php-cgi >/dev/null 2>&1; then
            echo "php-cgi already present: $(php-cgi --version | head -1)"
            exit 0
          fi
          sudo apt-get update             -o DPkg::Lock::Timeout=180             -o Acquire::Retries=2             -o Acquire::http::Timeout=15             -o Acquire::https::Timeout=15
          sudo apt-get install -y -o DPkg::Lock::Timeout=180 php-cgi
      # PINNED, and at 1.25+. This job had no Go setup at all, so it built with
      # whatever the runner image shipped — and on 2026-08-20 that broke outright:
      # a transitive genproto module published the day before now requires
      # go >= 1.25.0, while the image carried 1.24.13. `xcaddy build` resolves
      # latest transitive deps, so an unpinned toolchain here is a build that can
      # break with no commit of ours involved. It did.
      - name: Set up Go (xcaddy builds the host Caddy for resources/runtime)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build the service runtime (bundled Caddy)
        run: npm run build:runtime
      - name: Real hosting tests (bundled Caddy + php-cgi)
        run: npm run test:hosting
