name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# this workflow only reads the repo — checkout, install, typecheck, test, build.
# No PR writes, releases, or SARIF uploads, so read-only contents is sufficient.
permissions:
  contents: read

# Cancel a PR run the moment a newer push replaces the commit it was testing.
# Measured over 2026-09-07..09: 52 CI/E2E runs kept going after a newer run on
# the same branch had already started, burning 418 runner-minutes (1353 weighted
# at Windows x2 / macOS x10) — 16% of all CI+E2E spend — to answer questions
# about commits nobody would ever merge. On a squash-merged PR those intermediate
# commits do not survive into `main` at all, so no coverage is lost.
#
# `cancel-in-progress` is `pull_request` ONLY. A push to `main` runs to
# completion: main's per-commit green is the record of WHICH merged commit was
# good, and cancelling it would trade a real fact for runner minutes.
#
# `github.event_name` is IN the group key, not only in the condition. Two runs in
# one group with different `cancel-in-progress` values resolve to the newest
# run's value — so a PR run sharing a group with a main run could cancel it.
# Keying on the event makes that unrepresentable rather than merely unlikely.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (main)
        run: npx tsc --noEmit -p main/tsconfig.json
      - name: Typecheck (renderer)
        run: npx tsc --noEmit -p renderer/tsconfig.json
      # The E2E specs used to be the one tree nothing typechecked, and the cost
      # was not theoretical: a helper whose return type omitted a field made a
      # spec wait 15 seconds for something that could never arrive, and the
      # feature under test was working the whole time. Checked HERE (cheap,
      # seconds) rather than discovered in the E2E workflow (minutes, per OS).
      - name: Typecheck (e2e)
        run: npx tsc --noEmit -p e2e/tsconfig.json
      - name: Vitest
        run: npm test
      - name: Build renderer (static export)
        run: npx next build renderer

  # REAL hosting tests (`*.real.test.ts`) — launch the ACTUAL bundled Caddy /
  # php-cgi and curl them, so a broken serve mode fails CI instead of shipping
  # (the mocked hosting E2E never runs a web server; two hostServe sites colliding
  # on Caddy's :2019 admin port sailed straight through it). Linux-only: the
  # runner has Docker for future container-backed real tests, and php-cgi installs
  # cleanly. Needs `build:runtime` first for the Caddy binary.
  hosting:
    runs-on: ubuntu-latest
    # 20, not 15: apt now regularly waits on the runner's own
    # unattended-upgrades holding the dpkg lock, and the real hosting tests need
    # room after it.
    #
    # 30, not 20, since `postgres-image.real.test.ts`: that one BUILDS the Genie
    # Postgres image (pull the pgvector base, apt-install PostGIS) before it can
    # run a database and install every whitelisted extension into it. A few
    # minutes, and worth them — it is the only place in this repository that
    # proves the extensions Genie advertises are the extensions the image ships.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      # Bounded, and with its own timeout, because this step silently killed the
      # gate. apt waits on the dpkg lock FOREVER by default; on 2026-08-19 the
      # runner image began holding it long enough that apt ate 13m19s of a
      # 15-minute job budget, so the job was CANCELLED — and a cancelled job does
      # not read as a failure, so three merges went by with the real-hosting gate
      # never running at all. DPkg::Lock::Timeout makes the wait bounded, and the
      # step timeout turns any remaining hang into a visible FAILURE instead of a
      # quiet cancellation.
      # Only reach for apt when the runner does not already have php-cgi.
      #
      # This step silently killed the gate: apt waits forever by default, and on
      # 2026-08-19 azure.archive.ubuntu.com stopped answering, so every repo was
      # retried with backoff until the job hit its budget and was CANCELLED — and a
      # cancelled job does not read as a failure, so three merges went by with the
      # real-hosting gate never running.
      #
      # Asking whether the binary is there first makes the normal case instant and
      # independent of any mirror. The apt path stays as the fallback, now bounded
      # (retries + per-request timeouts + a lock timeout) and under a step timeout,
      # so a hang is a visible FAILURE instead of a quiet cancellation.
      - name: Ensure php-cgi (the FastCGI worker the php serve mode spawns)
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v php-cgi >/dev/null 2>&1; then
            echo "php-cgi already present: $(php-cgi --version | head -1)"
            exit 0
          fi
          sudo apt-get update             -o DPkg::Lock::Timeout=180             -o Acquire::Retries=2             -o Acquire::http::Timeout=15             -o Acquire::https::Timeout=15
          sudo apt-get install -y -o DPkg::Lock::Timeout=180 php-cgi
      # PINNED, and at 1.25+. This job had no Go setup at all, so it built with
      # whatever the runner image shipped — and on 2026-08-20 that broke outright:
      # a transitive genproto module published the day before now requires
      # go >= 1.25.0, while the image carried 1.24.13. `xcaddy build` resolves
      # latest transitive deps, so an unpinned toolchain here is a build that can
      # break with no commit of ours involved. It did.
      - name: Set up Go (xcaddy builds the host Caddy for resources/runtime)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # Off, explicitly. This repository has no `go.sum` — Go is here solely
          # so xcaddy can build Caddy — so setup-go's own cache has nothing to
          # key on and every run logged
          #   `Restore cache failed: Dependencies file is not found … go.sum`
          # before compiling the whole graph from source anyway. The keyed cache
          # below does the job the warning was pretending to.
          cache: false
      # Measured on run 34414872469: `go install xcaddy` 11.5s + `xcaddy build`
      # 45.6s = 57s of EVERY hosting run spent re-downloading and re-compiling
      # the same pinned dependency graph.
      #
      # Speed is the smaller half of the reason. It also deletes a dependency on
      # proxy.golang.org from every run — and an external service deciding
      # whether this gate runs is not hypothetical here: an unreachable apt
      # mirror silently CANCELLED this job for three merges running (see the
      # php-cgi step above). One less network in the critical path.
      #
      # Correctness does not rest on the key. Go's module and build caches are
      # content-addressed, so a partially-matching restore is reused only where
      # the inputs genuinely match and a miss just builds from source, exactly as
      # today. The key hashes build-service-runtime.mjs because every pinned
      # version xcaddy resolves — Caddy, replace-response, xcaddy itself — is
      # declared in that file, so a bump misses by construction.
      - name: Cache Go module + build caches (xcaddy's inputs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-caddy-${{ runner.os }}-go1.25-${{ hashFiles('scripts/build-service-runtime.mjs') }}
          restore-keys: |
            go-caddy-${{ runner.os }}-go1.25-
      - name: Build the service runtime (bundled Caddy)
        run: npm run build:runtime
      # THE JOB HAD NO WAY TO GET ITS IMAGES (genie#636).
      #
      # `*.real.test.ts` runs REAL containers, and this job had no `docker pull`
      # and no `docker login` — it depended entirely on whatever the runner image
      # happened to cache, plus anonymous Docker Hub pulls. On 2026-09-11 both
      # moved at once: `redis:7-alpine` was not cached and `minio/minio` answered
      # anonymous clients with "pull access denied". Six tests failed, four of
      # them as `expected 'failed' to be 'running'`, which reads as a product bug
      # and cost two CI rounds before the cause was visible.
      #
      # Pulling them HERE, by name, is what makes a registry problem fail AS a
      # registry problem, at a named step, before any test runs. The alternative
      # — leaving it to the tests — is what produced the misdiagnosis.
      #
      # These are the Docker Hub images the real suite runs. The Genie Postgres
      # image is NOT listed: `postgres-image.real.test.ts` builds it from the
      # pgvector base below, which is the thing that needs fetching.
      #
      # Retried, because a registry blip is not a code failure and a one-shot
      # pull turns one into the other. Still bounded: three attempts, then a
      # loud, named failure.
      #
      # NOT THE WHOLE FIX. Anonymous pull limits are the root cause and they only
      # tighten; `docker/login-action` with a Hub token would remove the class.
      # That needs a repository secret, so it is the owner's to add — see #636.
      - name: Pull the images the real tests run
        timeout-minutes: 8
        run: |
          for image in redis:7-alpine pgvector/pgvector:pg17 minio/minio:latest; do
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::Could not pull $image after 3 attempts. The real hosting tests cannot run without it; this is a registry/auth problem, not a code failure."
                exit 1
              fi
              sleep $((attempt * 10))
            done
          done
      - name: Real hosting tests (bundled Caddy + php-cgi)
        run: npm run test:hosting
