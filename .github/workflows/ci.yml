name: CI

# PROBE (throwaway, never merged): hang-cdp's Windows step, three times, logging the first agent's session states and the
# host's lifecycle lines (GENIE-PROBE). Everything else is left out on purpose.

on:
  push:
    branches: ['next/probe-**']

permissions:
  contents: read

jobs:
  probe-hang:
    name: probe hang-cdp (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - run: npm ci
      - run: npm run build
      - name: hang-cdp, run 1
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/hang-cdp.mjs
          if ($LASTEXITCODE -ne 0) { throw "hang-cdp failed (exit $LASTEXITCODE)" }
      - name: hang-cdp, run 2
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/hang-cdp.mjs
          if ($LASTEXITCODE -ne 0) { throw "hang-cdp failed (exit $LASTEXITCODE)" }
      - name: hang-cdp, run 3
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/hang-cdp.mjs
          if ($LASTEXITCODE -ne 0) { throw "hang-cdp failed (exit $LASTEXITCODE)" }
