name: CI

# genie2's OWN pipeline. It shares nothing with the previous Genie repository — not a
# workflow, not a script, not a cache key. The rebuild exists because the old code's core
# abstraction was wrong, and a CI that reached back into it would be the first way that
# abstraction came back.
#
# No Docker. These suites need no service containers, which also keeps them clear of the
# Docker Hub unauthenticated pull quota that made the old repo's `hosting` job unrunnable
# (Renaissance-Analytics/genie#864).

on:
  push:
    # main, plus the long-lived integration branches (next/host-split-tms): the owner, 2026-11-01, wants
    # them checked like main after every merge, Windows unit included.
    branches: [main, 'next/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the contract. prism-acp is ESM-only
      # and prism-harness pins the durability layer we build on, so a silent resolution drift
      # is a behaviour change, not a version bump.
      - run: npm ci

      # Typecheck is a first-class gate, not a lint. The no-pty rule is enforced IN THE TYPE
      # SYSTEM — `AgentEngine` has one member — so a green tsc is part of how that rule holds.
      - run: npm run typecheck

      - run: npm test

      # THE BUILD IS A GATE, not a release step.
      #
      # A typecheck says the sources agree with each other; it says nothing about whether the
      # three bundles can be produced. Three ways this job has already earned its place:
      #
      #  - the renderer loads over `file://` in Electron, so `base` must stay relative — an
      #    absolute `/assets/...` 404s into a blank white window that no unit test can see;
      #  - the preload MUST come out as CommonJS, because a sandboxed preload supports only
      #    CJS and an ESM one loads as nothing at all. `window.genie` is then simply absent and
      #    the app opens looking like a Dashboard with no agents rather than a broken bridge;
      #  - Tailwind only emits a class it finds in a scanned file, so a wrong `@source` ships
      #    a stylesheet with none of the board's metrics in it and every surface collapses.
      - run: npm run build

      # The three artifacts, asserted individually. A green build step proves the commands
      # exited 0; this proves they produced the files the app loads, with the content that
      # makes them work. "It built" is not "it is there".
      - name: the bundles exist, and are the right shape
        run: |
          set -euo pipefail
          test -f dist/renderer/index.html
          test -f dist/main/entry.js
          test -f dist/main/main.js
          test -f dist/main/staging-acl-worker.js
          test -f dist/main/doctor.js
          test -f dist/main/preload.cjs
          test -f dist/main/doctor-preload.cjs
          test -f dist/renderer/doctor.html

          # CommonJS, not ESM. `require`/`exports` present and no bare `import ... from`.
          grep -q "require(" dist/main/preload.cjs
          ! grep -qE "^import .* from" dist/main/preload.cjs

          # Relative asset paths, or the window is white.
          ! grep -qE '(src|href)="/' dist/renderer/index.html
          ! grep -qE '(src|href)="/' dist/renderer/doctor.html

          # Tailwind actually scanned our sources: the board's exact column template, the
          # 280px palette box and the rail's 30px rows all have to be in the stylesheet.
          # Two pages now (Genie and the doctor window), so two stylesheets: read the one index.html links.
          css="dist/renderer/$(grep -m1 -oE 'assets/[^"]+\.css' dist/renderer/index.html)"
          test -f "$css"
          grep -q "150px_minmax" "$css"
          grep -q "280px" "$css"
          grep -q "30px" "$css"

      # EVERY ALERT SOUND IS IN THE BUILT RENDERER (Tynn #441; test/alert-sound-library.test.ts): each sound file under
      # src/renderer/sounds/ was emitted under dist/renderer/assets/, which electron-builder packs whole (dist/**). The unit
      # test holds every choice to a file in that folder; this holds the folder to what the build shipped.
      - name: every alert sound is in the built renderer
        run: node scripts/sound-assets-check.mjs dist/renderer src/renderer/sounds

  # GENIE-HOST ON PLAIN NODE (the host split, P10.1b). genie-cloud runs `node dist/main/host.js` in a container with
  # Node 22 and no Electron (P10.3), so the host bundle has to boot and serve there. Node 22.16.0 exactly: the oldest
  # Node whose `node:sqlite` has FTS5, which the knowledge store needs (measured: 22.13.1, 22.14.0 and 22.15.0 answer
  # "no such module: fts5"; 22.16.0 and later create the table). No Electron binary is downloaded, so anything in
  # the host that reached for Electron fails here instead of finding one. The script says which step failed and why.
  host-plain-node:
    name: genie-host on plain Node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - run: npm run build:main

      - name: boot genie-host on plain Node and drive it
        run: timeout 300 node scripts/host-plain-node-boot.mjs

  # THE FLOWS ACCEPTANCE SUITE (`npm run verify:flows`, test/flows-acceptance/): every trigger and every node kind the
  # canvas offers, end to end through the real scheduler and runner. Not in `npm test` — the owner (2026-10-27): "only when
  # we make changes to flows" — so it runs when a change touches Flows, and only then.
  #
  # The job ALWAYS runs and decides for itself, rather than an `on.paths` filter: a required check whose workflow is filtered
  # out never reports, and a PR that touches no flow would wait on it for ever. So it is required, it reports on every PR,
  # and it runs the suite exactly when one of these changed (test/flows-acceptance-ci.test.ts holds the rules):
  #   - a file Flows are made of: scripts/flows-paths.mjs walks src/'s run-time imports, on this commit, from every file
  #     named flow and from the flow editor window's route (core/address.ts, route.ts…), and adds the files that wire a
  #     flow file in (compose.ts, feature-ipc.ts, main.ts, App.tsx…). Not by name: genie#1302 broke the editor through
  #     core/address.ts and a name rule never ran the suite;
  #   - the suite itself, its config and that script;
  #   - the fancy-flow dependency (its line in package.json or its version in package-lock.json).
  # Nothing here is piped into `grep -q`: grep exits at its first match, the writer dies of SIGPIPE, and under pipefail
  # a match reads as none. Each diff goes to a file first.
  flows:
    name: flows acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Before the decision: node makes it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: did this change touch Flows?
        id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A push that created the branch, or a base this checkout cannot see: run it rather than guess.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no base to compare with; running the suite"
            echo "flows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          flows=false
          node scripts/flows-paths.mjs --touched "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/touched.txt"
          if [ -s "$RUNNER_TEMP/touched.txt" ]; then echo "Touches Flows:"; cat "$RUNNER_TEMP/touched.txt"; flows=true; fi
          git diff "$BASE" HEAD -- package.json > "$RUNNER_TEMP/package.diff"
          if grep -qE '^[+-].*"@particle-academy/fancy-flow"' "$RUNNER_TEMP/package.diff"; then flows=true; fi
          git diff "$BASE" HEAD -- package-lock.json > "$RUNNER_TEMP/package-lock.diff"
          if grep -qE '^[+-].*fancy-flow-[0-9]' "$RUNNER_TEMP/package-lock.diff"; then flows=true; fi
          echo "flows=$flows" >> "$GITHUB_OUTPUT"
          echo "Flows changed: $flows"

      - run: npm ci
        if: steps.changed.outputs.flows == 'true'

      - run: npm run verify:flows
        if: steps.changed.outputs.flows == 'true'

  # THE UNIT SUITE ON WINDOWS, because the release runs it there. release.yml's Windows publish job
  # runs `npm test` before it builds, and until this job existed nothing on main ever had: beta.35's
  # Windows release failed on a CRLF checkout and beta.37's on a 5 s budget real git needed more of
  # (genie#1101). Each was found by the release, after the tag. This puts it on the PR instead.
  test-windows:
    name: unit (windows)
    # On pushes to main only (the owner, 2026-10-23: "main only"): Windows minutes cost the most, a Windows-only break
    # shows right after merge, and every release builds and tests on Windows itself before anything is published.
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      # Native staging tests exercise the same built worker that the packaged app loads.
      - run: npm run build:main
      # A 30 s budget per test HERE ONLY (test/ci-windows-test-budget.test.ts holds it): windows-latest runs the real-I/O
      # suites five to ten times slower than Linux, and one day's PRs timed out on six different ones at the 5 s default,
      # none touched by the PR (2026-10-22). A hang still fails; a slow runner no longer does. Linux keeps 5 s.
      # A PROCESS AND DISK SAMPLER BESIDE IT, observe only (scripts/ci/proc-sampler.ps1): the suite stalls now and then on
      # this runner (a beforeEach of ~100 ms over 10 s, EBUSY on a temp file) with nothing to say what the machine was doing.
      # It changes no test and no budget; its samples go up as an artifact, and only a failed suite prints a short summary.
      # It is stopped when the suite ends, and ends itself in any case before the job could.
      - name: npm test, with the sampler beside it
        shell: pwsh
        run: |
          $samples = Join-Path $env:RUNNER_TEMP "proc-samples.log"
          $results = Join-Path $env:RUNNER_TEMP "vitest-results.json"
          $sampler = Start-Process pwsh -ArgumentList '-NoProfile', '-File', 'scripts/ci/proc-sampler.ps1', '-Out', $samples -PassThru -WindowStyle Hidden
          try {
            npm test -- --testTimeout=30000 --reporter=default --reporter=json "--outputFile.json=$results"
            $code = $LASTEXITCODE
          } finally {
            Stop-Process -Id $sampler.Id -Force -ErrorAction SilentlyContinue
          }
          if ($code -ne 0) { node scripts/ci/proc-sampler-summary.mjs $samples $results }
          exit $code
      - name: the sampler's samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-windows-proc-samples
          path: ${{ runner.temp }}/proc-samples.log
          if-no-files-found: ignore
          retention-days: 7
      # THE SLOWEST TESTS, observe only (scripts/ci/slow-tests.mjs; test/ci-windows-slow-tests.test.ts holds it): after
      # every run, pass or fail, the 15 slowest tests, every test over 10 s (a third of the budget) and every file over 10 s
      # outside its tests, from the results file the suite already writes. Rows near the 30 s budget are seen before a bad
      # runner pushes them over it. It changes no test and no budget, and it cannot fail the job.
      - name: the slowest tests (observe only)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: node scripts/ci/slow-tests.mjs (Join-Path $env:RUNNER_TEMP "vitest-results.json") (Join-Path $env:RUNNER_TEMP "slow-tests.tsv")
      - name: the slow-test table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-windows-slow-tests
          path: ${{ runner.temp }}/slow-tests.tsv
          if-no-files-found: ignore
          retention-days: 7


  # THE ZIP64 CHECK (`npm run verify:zip64`, test/zip64-acceptance/): a tree past 65,535 entries exported and read back. Not in
  # `npm test`: it took 172-320 s of a 208-350 s Linux suite, and what it proves changes only with the zip writer. It also runs
  # in the release (release.yml). As with `flows acceptance`, the job always reports and decides for itself; a required check
  # filtered out by `on.paths` never reports. test/zip64-acceptance-ci.test.ts holds the rules. Nothing is piped into grep.
  zip64:
    name: zip64 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Before the decision: node makes it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: did this change touch the zip writer?
        id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A push that created the branch, or a base this checkout cannot see: run it rather than guess.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no base to compare with; running the check"
            echo "zip64=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          zip64=false
          node scripts/zip64-paths.mjs --touched "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/touched.txt"
          if [ -s "$RUNNER_TEMP/touched.txt" ]; then echo "Touches the writer:"; cat "$RUNNER_TEMP/touched.txt"; zip64=true; fi
          git diff "$BASE" HEAD -- package.json > "$RUNNER_TEMP/package.diff"
          if grep -qE '^[+-].*"yazl"' "$RUNNER_TEMP/package.diff"; then zip64=true; fi
          git diff "$BASE" HEAD -- package-lock.json > "$RUNNER_TEMP/package-lock.diff"
          if grep -qE '^[+-].*/(yazl|buffer-crc32)-[0-9]' "$RUNNER_TEMP/package-lock.diff"; then zip64=true; fi
          echo "zip64=$zip64" >> "$GITHUB_OUTPUT"
          echo "Zip writer changed: $zip64"

      - run: npm ci
        if: steps.changed.outputs.zip64 == 'true'

      - run: npm run verify:zip64
        if: steps.changed.outputs.zip64 == 'true'

  smoke:
    name: a real window
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Electron is Chromium and needs its graphics, font and a11y libraries. `xauth` is not
      # obvious and is not optional: `xvfb-run` shells out to it, and without it the launch
      # dies with "xauth command not found" — which presents as "the window never appeared",
      # pointing at the harness rather than at the missing package.
      - name: install Electron's runtime libraries
        run: |
          sudo apt-get update
          # Each package, with a `t64` fallback.
          #
          # Ubuntu 24.04 renamed several of these in the 64-bit time_t transition —
          # `libasound2` became `libasound2t64`, and on noble the old name is a virtual package
          # with "no installation candidate". The list here was taken from Debian bookworm,
          # where the old names are correct, so a single flat `apt-get install` is wrong on one
          # of the two and this survives both. It also survives the runner image moving again,
          # which it will.
          for pkg in xvfb xauth libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6                      libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libasound2                      libpangocairo-1.0-0 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3                      libxrandr2 fonts-liberation fontconfig; do
            sudo apt-get install -y --no-install-recommends "$pkg"               || sudo apt-get install -y --no-install-recommends "${pkg}t64"               || { echo "could not install $pkg or ${pkg}t64"; exit 1; }
          done

      # Make font resolution representative of a desktop. Measured: without this the runner's
      # `system-ui` can resolve to a MONOSPACE face, the whole app renders monospaced, and that
      # is indistinguishable from a real stylesheet bug. A verification environment that cannot
      # tell the two apart is not a verification environment.
      - name: make font resolution representative
        run: |
          sudo cp scripts/smoke-fonts.conf /etc/fonts/local.conf
          sudo fc-cache -f

      - run: npm ci

      - run: npm run build

      # Seed a workspace and an agent, so the smoke proves a CLICK reaches a surface rather
      # than only that an empty Dashboard renders. It writes the two JSON files a real machine
      # would already have — nothing in `src/` knows it exists.
      - run: node scripts/smoke-seed.mjs

      # THE CHECK THAT WAS MISSING FROM ALL FOUR FAILED BETAS.
      #
      # Four releases shipped on green unit suites and every one was broken the moment a human
      # opened it, because nobody ever opened the built app. This opens it: a real Electron
      # window on a virtual display, driven over the Chrome DevTools Protocol — no third-party
      # test framework, using the app's same bridge through GENIE_PAGE_PROBE.
      - name: open the app and drive it
        run: |
          # Point codex at the stub, exactly as `smoke-linux-inner.sh` does. Ordinary provider
          # configuration — the product behaves identically with or without it — and it is what
          # lets a REAL parked approval reach the screen in an environment with no codex.
          chmod +x scripts/stub-codex.mjs
          export GENIE2_CODEX_BINARY="$PWD/scripts/stub-codex.mjs"
          export GENIE_PAGE_PROBE=1

          xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24'             npx electron . --no-sandbox --remote-debugging-port=9222 > electron.log 2>&1 &
          # `timeout` on each script, and it is not a formality. This step HUNG for 15 minutes
          # on five consecutive runs today, and a job that hits its time limit reports as
          # `cancelled` — which reads as "somebody pushed again", skips every `if: failure()`
          # step, and so hides the one log that would have said where it stopped. A hang that
          # fails in five minutes with its output attached is a bug report; one that is
          # cancelled at fifteen is a shrug.
          timeout 300 node scripts/agents-hold-no-pty-cdp.mjs
          timeout 300 node scripts/smoke-cdp.mjs
          timeout 300 node scripts/layout-sweep.mjs

      - name: native local door, including an admission break control
        id: local-door
        continue-on-error: true
        run: |
          # On a test keyring, as the site panel rows: row 4 opens a real site panel, and its store opens only with the key (P2b store guard).
          # This step runs before the site panel step, so it installs the keyring itself (apt is idempotent).
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
          set +e
          timeout 300 dbus-run-session -- bash scripts/with-test-keyring.sh node scripts/local-door-cdp.mjs --break-admission > local-door-break.log 2>&1
          probe=$?
          cat local-door-break.log
          if [ "$probe" -ne 1 ] || ! grep -q 'FAIL 1:' local-door-break.log || ! grep -q 'actual refusal:.*not an admitted' local-door-break.log; then
            echo 'code=1' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          timeout 300 dbus-run-session -- bash scripts/with-test-keyring.sh node scripts/local-door-cdp.mjs > local-door.log 2>&1
          code=$?
          cat local-door.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: record the native door result without treating unavailable rows as passed
        if: always()
        run: |
          code='${{ steps.local-door.outputs.code }}'
          if [ "$code" = 2 ]; then
            echo '::warning::Native local door coverage is INCOMPLETE; see UNMEASURED rows in local-door.log.'
            echo 'Native local door: **INCOMPLETE (exit 2)**. Unavailable rows remain a coordinator VM/review gate.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" != 0 ]; then
            echo 'Native local door: **FAILED**.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo 'Native local door: **all rows measured and passed**; admission break control failed as expected.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-door-linux
          path: |
            local-door*.log
            smoke-out/local-door*
          if-no-files-found: warn
          retention-days: 7

      - name: Files view watches and oversized cached refetch
        run: timeout 180 node scripts/files-watch-cdp.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: files-watch-linux
          path: smoke-out/files-watch*
          if-no-files-found: warn
          retention-days: 7

      - name: Chat drafts with large attachments, paste and paged load-all
        run: timeout 360 node scripts/chat-drafts-cdp.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-drafts-linux
          path: smoke-out/chat-drafts*
          if-no-files-found: warn
          retention-days: 7

      - name: ArtBoard images, paged posts and the native image-post path
        run: timeout 360 node scripts/artboard-cdp.mjs --trace-main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artboard-linux
          path: smoke-out/artboard*
          if-no-files-found: warn
          retention-days: 7
      # UI LAG DURING A WRITE-HEAVY BUILD (Tynn #274 / #429; the host split's P2 row: "a write-heavy build never blocks the
      # window more than 50 ms"). A build in a Genie terminal while the mouse moves and keys are typed; window main, the page
      # and genie-host gauged, then profiled, and the worst gaps printed with their stacks (UI_LAG / UI_LAG_STACK lines).
      - name: UI lag during a write-heavy build
        if: ${{ !cancelled() }}
        run: timeout 420 node scripts/ui-lag-cdp.mjs --budget

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-lag-linux
          path: smoke-out/ui-lag*
          if-no-files-found: warn
          retention-days: 7
      # THE TRUST STEP, AS A PERSON SEES IT. It starts the app itself, on a home and a port of its own.
      - name: the trust step in the real app
        run: timeout 300 xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' node scripts/trust-step-cdp.mjs

      # THE SPAWN HOST STARTED INSIDE THE REAL APP (genie#1397): main creates no processes on its own thread; the child it
      # forks at boot does. A child that could not start falls back to in-process silently for the person, so it is
      # checked here, in the lifecycle log the app itself writes.
      # A SITE PANEL IN GENIE'S OWN WINDOW (P2b): its real CSP, its real preload, a real <webview>, main's guard.
      # Its own launch, home and profile. No Caddy here, so the page itself is the VM's to show.
      - name: a site panel in the real window
        run: |
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
          # An unlocked keyring on its own session bus: no store opens without one (core/browser-store.ts).
          timeout 280 dbus-run-session -- bash scripts/with-test-keyring.sh node scripts/site-panel-cdp.mjs

      - name: a site panel with no key opens no store
        run: SITE_PANEL_LOCKED=1 CDP_PORT=9336 timeout 120 node scripts/site-panel-cdp.mjs

      # THE GENIE BROWSER AS ITS OWN PROCESS (P2b): started by the host, outliving the window, ended with the host.
      - name: the Genie browser's own process
        run: timeout 260 dbus-run-session -- bash scripts/with-test-keyring.sh node scripts/browser-process-cdp.mjs

      - name: the spawn host started in the real app
        run: |
          grep -h "spawn host" ~/.genie/runtime/lifecycle.log | tail -5 || true
          grep -q "spawn host ready pid=" ~/.genie/runtime/lifecycle.log
          if grep -q "spawn host could not start" ~/.genie/runtime/lifecycle.log; then exit 1; fi

      # SAFE MODE AND A HUNG WINDOW, AS A PERSON MEETS THEM (Tynn #386). Each starts the app itself, on a home and ports of
      # its own: a clean quit as the control, then the window and genie-host killed by pid; a window main held 40 s.
      - name: safe mode after Genie did not end cleanly
        if: ${{ !cancelled() }}
        run: timeout 540 xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' node scripts/safe-mode-cdp.mjs
      - name: a hung window is ended and opened again
        if: ${{ !cancelled() }}
        run: timeout 540 xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' node scripts/hang-cdp.mjs
      # A WINDOW'S PAGE THAT ENDS IS BROUGHT BACK (Tynn #386; the owner's black window of 2026-11-06, an oom).
      - name: a window's page that ends is brought back
        if: ${{ !cancelled() }}
        run: timeout 420 xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' node scripts/renderer-crash-cdp.mjs

      - name: electron's own output
        # `always()`, not `failure()`: a timeout-cancelled job is neither success nor failure
        # to GitHub, and that was exactly the case where this log mattered most.
        if: always()
        run: tail -100 electron.log || true

      # The screenshots, for a human to look at. Writing one is not the same as somebody
      # having seen it, and this step does not pretend otherwise — it just makes looking cheap.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-*.png
          if-no-files-found: warn
          retention-days: 7

  package:
    name: it packages
    # Installers on pushes to main only (2026-10-23, the CI cost trims): a release builds and verifies its own
    # (release.yml), and main's build catches a packaging break the day it merges. Not on every PR push.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The bundles first. `electron-builder` packs `dist/` — it does not produce it — so
      # without this it packs an app.asar with no entry file and fails with
      # "Application entry file dist/main/main.js is corrupted", which reads like a broken
      # build rather than a missing step.
      - run: npm run build

      # `--publish never`, and it is not a formality.
      #
      # This job BUILDS an installer; it does not release one. Implementation authorisation is
      # not release authorisation, and nothing here may create a tag, a release or an
      # auto-update feed entry. Publishing is a separate, human-approved step.
      - name: fetch the pinned Caddy runtime
        run: npx tsx scripts/fetch-caddy.ts

      - name: build the installers
        # Ordinary CI has no signing identity. Keep icon/resource editing; protected jobs sign.
        run: npx electron-builder --publish never ${{ runner.os == 'Windows' && '--config.win.signExecutable=false' || '' }}

      # NO OTHER PUBLISHER'S SIGNATURE IS REPLACED (scripts/win-sign-plan.mjs; test/win-sign-plan.test.ts). On this
      # UNSIGNED package: the files a signed build would sign, by electron-builder's own rule, and each file's signer as
      # it shipped. It fails if any of them already carries another publisher's valid signature (Microsoft's conpty.dll,
      # OpenConsole.exe and d3dcompiler_47.dll were re-signed as ours; measured, run 42377299413). Nothing is signed here.
      - name: a signed build would sign no file another publisher signed
        if: runner.os == 'Windows'
        run: node scripts/win-sign-plan.mjs release/win-unpacked electron-builder.yml --check

      # THE INSTALL DIRECTORY HOLDS WHAT THE APP RUNS (scripts/packed-tree-check.mjs; test/packed-tree.test.ts; Tynn #437):
      # no other platform's binaries, no build scripts or sources, and every file the app loads on Windows x64.
      - name: the packaged tree holds only what the app runs
        if: runner.os == 'Windows'
        run: node scripts/packed-tree-check.mjs release/win-unpacked

      - name: prove the packaged Windows updater metadata and asset names
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-update.cjs release test/fixtures/windows-update-beta59.json

      # The fuse as the built binary has it, not as the config asks.
      - name: the cookie fuse is on in what was packaged
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then app=$(ls release/win-unpacked/*.exe | head -1); else app=$(ls -d release/linux-unpacked/[gG]enie* | head -1); fi
          npx --yes @electron/fuses read --app "$app" | tee fuses.txt
          grep -q "EnableCookieEncryption is Enabled" fuses.txt
      # genie-launch.exe IN WHAT WAS PACKAGED, AND USED (#1628). A silent fall back to Node's spawn in the shipped app would
      # bring both of its bugs back quietly (the window's handles in genie-host; a git read's children outliving it). So the
      # packaged app is started on a home of its own, and its own log must say the host was started through the launcher.
      - name: the packaged app starts genie-host through genie-launch.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $launcher = "release\win-unpacked\resources\bin\genie-launch.exe"
          if (-not (Test-Path $launcher)) { throw "genie-launch.exe is not in the packaged app ($launcher)" }
          Write-Output "packaged: $launcher ($((Get-Item $launcher).Length) bytes)"
          $h = Join-Path $env:RUNNER_TEMP "packaged-home"
          foreach ($d in @("$h\AppData\Roaming", "$h\AppData\Local")) { New-Item -ItemType Directory -Force $d | Out-Null }
          $env:USERPROFILE = $h; $env:HOME = $h; $env:APPDATA = "$h\AppData\Roaming"; $env:LOCALAPPDATA = "$h\AppData\Local"
          $app = Start-Process -FilePath (Resolve-Path "release\win-unpacked\Genie.exe") -PassThru
          $log = "$h\.genie\runtime\lifecycle.log"
          $line = $null
          for ($i = 0; $i -lt 90 -and -not $line; $i++) { Start-Sleep -Seconds 1; if (Test-Path $log) { $line = Select-String -Path $log -Pattern "host spawn via=" | Select-Object -Last 1 } }
          $hostJson = "$h\.genie\runtime\host.json"
          if (Test-Path $hostJson) { $hp = (Get-Content $hostJson | ConvertFrom-Json).pid; if ($hp) { Stop-Process -Id $hp -Force -ErrorAction SilentlyContinue } }
          if (-not $app.HasExited) { taskkill /PID $app.Id /T /F *> $null }
          if (-not $line) { throw "the packaged app logged no host spawn within 90 s" }
          Write-Output "the packaged app: $($line.Line)"
          if ($line.Line -notmatch "via=genie-launch") { throw "the packaged app started genie-host WITHOUT genie-launch.exe" }

      # The artifacts, so somebody can actually install one and find out. A build that produced
      # a file nobody can reach proves only that the command exited zero.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.yml
            release/signature-evidence/
          if-no-files-found: error
          retention-days: 7

  smoke-windows:
    name: a real window (windows)
    # On pushes to main only (the owner, 2026-10-23: "main only"): Windows minutes cost the most, a Windows-only break
    # shows right after merge, and every release builds and tests on Windows itself before anything is published.
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # EVERY window this build has opened has been Linux, and the owner works on Windows.
      #
      # That is not a small difference for this app: `src/main/paths.ts` case-folds there and
      # not elsewhere, the renderer picks `Ctrl` over the Apple key, Electron's window chrome
      # differs, and a path separator bug on one platform is invisible on the other. This
      # repository has already had a test that passed on Windows and broke on ubuntu for
      # exactly that reason.
      #
      # A GitHub runner is not the owner's desktop, so the standing rule is satisfied — this is
      # the "or in a VM" half of it.
      - run: node scripts/smoke-seed.mjs

      - name: open the app and drive it
        shell: pwsh
        run: |
          # Windows runners have a desktop session, so Electron opens a real window with no
          # virtual display needed. `--no-sandbox` is NOT passed: the sandbox works here, and
          # weakening it to match the container would be testing a weaker product.
          # `npx.cmd`, not `npx`. Start-Process launches an executable directly rather than
          # through a shell, so a extensionless shim fails with
          # "%1 is not a valid Win32 application" — which names neither the file nor the
          # reason. The sibling Genie repo has hit this exact class before.
          # The approval round trip runs HERE TOO, and getting to that took a wrong turn
          # worth recording, because the wrong version of this comment was briefly committed.
          #
          # A bare spawn of an npm-installed "codex.cmd" app-server throws EINVAL
          # synchronously on Windows: npm installs CLIs as .cmd shims and Node refuses to
          # spawn one without `shell: true` (the CVE-2024-27980 fix). I measured that, and
          # concluded codex could not be started here at all.
          #
          # It was the wrong call to measure. prism-acp passes
          # `shell: process.platform === 'win32'` at BOTH of its spawn sites — verified in the
          # installed 0.6.1 — so the library never makes the call I reproduced. Through the
          # REAL driver, codex starts on Windows and reports a session id. Copying a
          # library's binary and args faithfully while dropping its options object produces a
          # repro that looks complete and is not.
          #
          # prism-acp 0.21 spawns a provider directly, never through a shell, and refuses a .cmd that is not an npm
          # shim (a real npm-installed codex IS one, and is accepted). The stub is the .mjs itself: Genie runs a
          # configured script as its own runtime + the script (session-host `providerLaunchOptions`).
          $env:GENIE2_CODEX_BINARY = "$PWD\scripts\stub-codex.mjs"
          $env:GENIE_PAGE_PROBE = '1'

          $app = Start-Process -FilePath "npx.cmd" -ArgumentList "electron",".","--remote-debugging-port=9222" `
                               -PassThru -RedirectStandardOutput electron-out.log -RedirectStandardError electron-err.log
          # pwsh does not stop on a native command's failure, and a step's result is its LAST command's exit code: each
          # smoke ends the step itself, or only the last one would ever gate (genie#1050's job passed with FAIL lines).
          try {
              node scripts/agents-hold-no-pty-cdp.mjs
              if ($LASTEXITCODE -ne 0) { throw "agents-hold-no-pty-cdp failed (exit $LASTEXITCODE)" }
              node scripts/smoke-cdp.mjs
              if ($LASTEXITCODE -ne 0) { throw "smoke-cdp failed (exit $LASTEXITCODE)" }
              node scripts/layout-sweep.mjs
              if ($LASTEXITCODE -ne 0) { throw "layout-sweep failed (exit $LASTEXITCODE)" }
          } finally {
              # STOP THE APP THIS STEP STARTED — all of it. `$app` is npx.cmd; Electron runs under it, and
              # `Stop-Process -Id $app.Id` killed only the wrapper: EVERY run left node, cmd and two or three electron
              # processes for the runner's "Cleaning up orphan processes" (2026-10-21, passing runs included). Once in a
              # while they still held the workspace when the next steps ran, and upload-artifact and the post-checkout
              # cleanup FAILED with no error line, after this step had passed (#1060's first run).
              # So: the whole tree, then anything still running Electron from this checkout (a tree whose npx parent
              # already exited is no longer a tree), then prove none is left.
              # Positive control: the filter below must find the app while it runs, or "none left" proves nothing.
              $before = @(Get-Process electron -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$PWD*" })
              Write-Output "electron processes from this checkout before stopping the app: $($before.Count)"
              if (-not $app.HasExited) { taskkill /PID $app.Id /T /F *> $null }
              $ours = @(Get-Process electron -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$PWD*" })
              Write-Output "electron processes from this checkout still running after the tree kill: $($ours.Count)"
              $ours | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              $left = @(Get-Process electron -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$PWD*" })
              if ($left.Count -gt 0) { throw "the app is still running after the step stopped it ($($left.Count) electron processes)" }
          }
          # taskkill sets $LASTEXITCODE, and the step's result is the last exit code: every failure above has
          # already thrown, so reaching here means the step passed.
          exit 0

      - name: native local door, including an admission break control
        id: local-door
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/local-door-cdp.mjs --break-admission *> local-door-break.log
          $probe = $LASTEXITCODE
          Get-Content local-door-break.log
          if ($probe -ne 1 -or -not (Select-String -Path local-door-break.log -Pattern 'FAIL 1:' -Quiet) -or -not (Select-String -Path local-door-break.log -Pattern 'actual refusal:.*not an admitted' -Quiet)) {
            'code=1' >> $env:GITHUB_OUTPUT
            exit 1
          }
          node scripts/local-door-cdp.mjs *> local-door.log
          $code = $LASTEXITCODE
          Get-Content local-door.log
          "code=$code" >> $env:GITHUB_OUTPUT
          exit $code

      - name: record the native door result without treating unavailable rows as passed
        if: always()
        shell: pwsh
        run: |
          $code = '${{ steps.local-door.outputs.code }}'
          if ($code -eq '2') {
            Write-Output '::warning::Native local door coverage is INCOMPLETE; see UNMEASURED rows in local-door.log.'
            'Native local door: **INCOMPLETE (exit 2)**. Unavailable rows remain a coordinator VM/review gate.' >> $env:GITHUB_STEP_SUMMARY
          } elseif ($code -ne '0') {
            'Native local door: **FAILED**.' >> $env:GITHUB_STEP_SUMMARY
            exit 1
          } else {
            'Native local door: **all rows measured and passed**; admission break control failed as expected.' >> $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-door-windows
          path: |
            local-door*.log
            smoke-out/local-door*
          if-no-files-found: warn
          retention-days: 7

      - name: Files view watches and oversized cached refetch
        shell: pwsh
        run: node scripts/files-watch-cdp.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: files-watch-windows
          path: smoke-out/files-watch*
          if-no-files-found: warn
          retention-days: 7

      - name: Chat drafts with large attachments, paste and paged load-all
        shell: pwsh
        run: node scripts/chat-drafts-cdp.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-drafts-windows
          path: smoke-out/chat-drafts*
          if-no-files-found: warn
          retention-days: 7

      - name: ArtBoard images, paged posts and the native image-post path
        shell: pwsh
        run: node scripts/artboard-cdp.mjs --trace-main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artboard-windows
          path: smoke-out/artboard*
          if-no-files-found: warn
          retention-days: 7
      # UI LAG DURING A WRITE-HEAVY BUILD, as on Linux above.
      - name: UI lag during a write-heavy build
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node scripts/ui-lag-cdp.mjs --budget
          if ($LASTEXITCODE -ne 0) { throw "ui-lag-cdp failed (exit $LASTEXITCODE)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-lag-windows
          path: smoke-out/ui-lag*
          if-no-files-found: warn
          retention-days: 7
      # THE TRUST STEP, AS A PERSON SEES IT, as on Linux above.
      - name: the trust step in the real app
        shell: pwsh
        run: |
          node scripts/trust-step-cdp.mjs
          if ($LASTEXITCODE -ne 0) { throw "trust-step-cdp failed (exit $LASTEXITCODE)" }

      # THE SPAWN HOST STARTED INSIDE THE REAL APP (genie#1397), as on Linux above.
      - name: the spawn host started in the real app
        shell: pwsh
        run: |
          $log = Join-Path $HOME ".genie\runtime\lifecycle.log"
          Select-String -Path $log -Pattern "spawn host" | Select-Object -Last 5 | ForEach-Object { $_.Line }
          if (-not (Select-String -Path $log -Pattern "spawn host ready pid=" -Quiet)) { exit 1 }
          if (Select-String -Path $log -Pattern "spawn host could not start" -Quiet) { exit 1 }

      # SAFE MODE AND A HUNG WINDOW, as on Linux above.
      - name: safe mode after Genie did not end cleanly
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node scripts/safe-mode-cdp.mjs
          if ($LASTEXITCODE -ne 0) { throw "safe-mode-cdp failed (exit $LASTEXITCODE)" }
      # genie-host is started through genie-launch.exe (#1628), inheriting nothing of the window's: a hung window's debugger
      # port is free for the window the host opens again. A gate on Windows as on Linux.
      - name: a hung window is ended and opened again
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node scripts/hang-cdp.mjs
          if ($LASTEXITCODE -ne 0) { throw "hang-cdp failed (exit $LASTEXITCODE)" }
      # A WINDOW'S PAGE THAT ENDS IS BROUGHT BACK, as on Linux above.
      - name: a window's page that ends is brought back
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node scripts/renderer-crash-cdp.mjs
          if ($LASTEXITCODE -ne 0) { throw "renderer-crash-cdp failed (exit $LASTEXITCODE)" }

      - name: the app's own output, on failure
        if: failure()
        shell: pwsh
        run: |
          Get-Content electron-err.log -Tail 60 -ErrorAction SilentlyContinue
          Get-Content electron-out.log -Tail 20 -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots-windows
          path: smoke-*.png
          if-no-files-found: warn
          retention-days: 7
