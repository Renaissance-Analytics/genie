name: Fancy + Prism drift

# THE DRIFT WATCHER for the @particle-academy/* packages Genie pins (Tynn #442). The owner, 10-15: "make sure we have a
# drift watcher step in our ci for the fancy and prism deps"; 10-22: "make sure we having something in our drift watcher
# that catches these security issues right away".
#
# Drift WARNS: a table in the job summary (pinned, latest, how far behind) and a warning annotation. The job stays green,
# so a PR is never red for drift alone. A known advisory on a pinned @particle-academy package, or on anything under one
# (npm audit against the lockfile, plus GitHub's advisory database), FAILS. The logic is scripts/ci/deps-drift.mjs,
# tested in test/ci-deps-drift.test.ts.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - scripts/ci/deps-drift.mjs
      - .github/workflows/deps-drift.yml

permissions:
  contents: read

concurrency:
  group: deps-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: fancy + prism drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Network only: npm's latest for each package, and GitHub's advisories that affect each pinned version.
      - name: npm latest + GitHub advisories
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/deps-drift.mjs collect --lock package-lock.json --latest "$RUNNER_TEMP/latest.json" --ghsa "$RUNNER_TEMP/ghsa.json"

      # npm audit exits non-zero whenever ANY package has an advisory; the report below decides, for this tree only.
      - name: npm audit
        run: npm audit --package-lock-only --json > "$RUNNER_TEMP/audit.json" || true

      - name: report (drift warns, an advisory fails)
        run: node scripts/ci/deps-drift.mjs report --package package.json --lock package-lock.json --latest "$RUNNER_TEMP/latest.json" --audit "$RUNNER_TEMP/audit.json" --ghsa "$RUNNER_TEMP/ghsa.json" --summary "$GITHUB_STEP_SUMMARY"
