<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
    Font aliases for the SMOKE CONTAINER only. Nothing here ships.

    Measured, not assumed: in the bare image `fc-match sans-serif` answers **Liberation Mono**,
    and Chromium's `system-ui` follows it. The whole application then renders monospaced, which
    looks identical to a real styling bug — and for one run it was mistaken for one.

    Liberation, not DejaVu: it is what `fonts-liberation` already installs, so the aliases
    point at fonts that are actually present. The first version of this preferred DejaVu and
    silently did nothing, because the package was never in the image — `fc-list` showed four
    Liberation families and no DejaVu at all. An alias to a font nobody has is a no-op that
    reads like a configuration.

    A verification environment that cannot tell a missing font alias from a broken stylesheet
    is not a verification environment. These three aliases make the container resolve fonts the
    way a desktop does, so the proportional-font check in `smoke-cdp.mjs` measures the app
    rather than the image.
-->
<fontconfig>
    <alias>
        <family>sans-serif</family>
        <prefer><family>Liberation Sans</family></prefer>
    </alias>
    <alias>
        <family>system-ui</family>
        <prefer><family>Liberation Sans</family></prefer>
    </alias>
    <alias>
        <family>monospace</family>
        <prefer><family>Liberation Mono</family></prefer>
    </alias>
</fontconfig>
